<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mortar Calculator</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
    </head>
    <body>
        <h1>Mortar Calculator</h1>

        <form action="/calculate" method="POST">
            <h2>Your coordinates</h2>
            <div>
                X: <input type="number" name="p1x" value="" /> Y:
                <input type="number" name="p1y" value="" />
            </div>
            <h2>Target coordinates</h2>
            <div>
                X: <input type="number" name="p2x" value="" /> Y:
                <input type="number" name="p2y" value="" />
            </div>
            <input type="submit" name="submit" value="Submit" />
        </form>

        Result:
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
