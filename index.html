<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Wardogs Mortar Calculator</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
            integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
            crossorigin="anonymous"
        />
    </head>

    <body class="bg-light">
        <main class="container py-2">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-dark text-white">
                            <h1 class="h3 mb-0">Wardogs Mortar Calculator</h1>
                        </div>

                        <div class="card-body">
                            <form action="/" method="POST">
                                <fieldset class="mb-4">
                                    <legend class="h5 mb-3">
                                        Your coordinates
                                    </legend>

                                    <div class="form-row">
                                        <div class="form-group col-12 col-sm-6">
                                            <label for="p1x"
                                                >X coordinate</label
                                            >
                                            <input
                                                id="p1x"
                                                type="number"
                                                name="p1x"
                                                value="{{.P1x}}"
                                                step="any"
                                                class="form-control"
                                                required
                                            />
                                        </div>

                                        <div class="form-group col-12 col-sm-6">
                                            <label for="p1y"
                                                >Y coordinate</label
                                            >
                                            <input
                                                id="p1y"
                                                type="number"
                                                name="p1y"
                                                value="{{.P1y}}"
                                                step="any"
                                                class="form-control"
                                                required
                                            />
                                        </div>
                                    </div>
                                </fieldset>

                                <fieldset class="mb-4">
                                    <legend class="h5 mb-3">
                                        Target coordinates
                                    </legend>

                                    <div class="form-row">
                                        <div class="form-group col-12 col-sm-6">
                                            <label for="p2x"
                                                >X coordinate</label
                                            >
                                            <input
                                                id="p2x"
                                                type="number"
                                                name="p2x"
                                                value="{{.P2x}}"
                                                step="any"
                                                class="form-control"
                                                required
                                            />
                                        </div>

                                        <div class="form-group col-12 col-sm-6">
                                            <label for="p2y"
                                                >Y coordinate</label
                                            >
                                            <input
                                                id="p2y"
                                                type="number"
                                                name="p2y"
                                                value="{{.P2y}}"
                                                step="any"
                                                class="form-control"
                                                required
                                            />
                                        </div>
                                    </div>
                                </fieldset>

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg btn-block"
                                >
                                    Calculate firing solution
                                </button>
                            </form>
                        </div>

                        <div class="card-footer bg-white">
                            <div class="row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <div class="border rounded p-3 h-100">
                                        <div
                                            class="text-muted text-uppercase small"
                                        >
                                            Distance
                                        </div>
                                        <div class="h3 mb-0">
                                            {{printf "%.2f" .Distance}} meters
                                        </div>
                                    </div>
                                </div>

                                <div class="col-sm-6">
                                    <div class="border rounded p-3 h-100">
                                        <div
                                            class="text-muted text-uppercase small"
                                        >
                                            Compass Angle
                                        </div>
                                        <div class="h3 mb-0">
                                            {{printf "%.2f" .Angle}}°
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <p class="text-center text-muted small mt-3 mb-0">
                        Created by
                        <a href="https://eric.olerud.com">Eric Olerud</a>
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
